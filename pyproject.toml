[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-hardening-checker"
version = "0.1.0"
description = "Analyze Dockerfiles and docker-compose files for security bad practices. Includes a web UI, a CLI, and a GitHub Action."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Mavis" },
]
keywords = ["docker", "security", "hardening", "dockerfile", "docker-compose", "linter", "ci", "github-action"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "Flask>=3.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/nacho/Docker-Hardening-Checker"
Issues = "https://github.com/nacho/Docker-Hardening-Checker/issues"

[project.scripts]
docker-hardening-checker = "cli:main"

# ---------------------------------------------------------------------------
# Setuptools package discovery (minimal; no real package layout to keep the
# repo flat and easy to browse).
# ---------------------------------------------------------------------------
[tool.setuptools]
py-modules = ["app", "cli"]
include-package-data = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov=cli",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=70",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error",
    # Flask's dev server prints this on every run; it's fine in tests.
    "ignore::DeprecationWarning:flask.cli",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["app", "cli"]
omit = [
    "tests/*",
    "smoke_test.py",
    "cli_smoke.py",
    "__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["samples", ".github", "_archive*"]

[tool.ruff.lint]
# Sensible default rule set; tighten per project.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument (Flask routes use this idiom)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # `assert False` is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["app", "cli"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "samples/",
    ".github/",
    "tests/",
    "build/",
    "dist/",
]
